name: CI

# push / PR 到 main 时，在 Windows + macOS 上做一次完整 tauri build 冒烟编译，
# 尽早发现平台特定（Win32 聚焦 / macOS osascript / NSIS 打包）的问题。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的旧运行自动取消，省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 先跑 hooks 状态机单测（纯 Node、秒级），任何状态转移回归第一时间暴露，不用等编译。
  hooks-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test hooks state machine
        run: node --test hooks/

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend deps
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build (smoke)
        working-directory: app
        run: pnpm tauri build
