<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude 看板</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="corner tl" aria-hidden="true"></div>
      <div class="corner tr" aria-hidden="true"></div>
      <div class="corner bl" aria-hidden="true"></div>
      <div class="corner br" aria-hidden="true"></div>

      <header id="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span id="sig" class="sig"></span>
          <span class="brand-name" data-tauri-drag-region>CLAUDE<span class="dot-sep">·</span>MON</span>
        </div>
        <div id="readout" class="readout" data-tauri-drag-region></div>
        <div class="ctl">
          <button id="gear" class="tb-btn" title="设置">⚙</button>
          <button id="pin" class="tb-btn" title="置顶">▲</button>
          <button id="hide" class="tb-btn" title="隐藏到托盘">▁</button>
        </div>
      </header>

      <main id="cards"></main>
      <div id="empty" class="empty hidden">
        <span class="empty-cursor">▮</span> 无运行中的会话
      </div>

      <!-- 用量条：Claude Code 本地 transcript 累加的 token（近 5h / 近 24h），无需登录 -->
      <footer id="usage" class="usage hidden"></footer>

      <!-- 设置下拉菜单（⚙）—— 开关走 data-k，逻辑在 main.js -->
      <div id="menu" class="menu hidden">
        <button class="menu-item" data-k="notify"><span class="mi-ico">🔔</span><span class="mi-label">状态通知</span><span class="mi-sw"></span></button>
        <button class="menu-item" data-k="sound"><span class="mi-ico">🔊</span><span class="mi-label">提示音</span><span class="mi-sw"></span></button>
        <button class="menu-item" data-k="autofocus"><span class="mi-ico">🎯</span><span class="mi-label">需输入时自动切窗</span><span class="mi-sw"></span></button>
        <button class="menu-item" data-k="light"><span class="mi-ico">🌗</span><span class="mi-label">亮色主题</span><span class="mi-sw"></span></button>
        <div class="menu-div"></div>
        <button class="menu-item" data-k="autostart"><span class="mi-ico">⏻</span><span class="mi-label">开机自启</span><span class="mi-sw"></span></button>
      </div>

      <!-- 采集端安装/升级弹窗：App 检测到 hooks 缺失或版本落后时弹出（仅固定看板 dock 弹一次） -->
      <div id="install-overlay" class="install-overlay hidden">
        <div class="install-card">
          <div class="install-title">更新采集组件</div>
          <div id="install-body" class="install-body"></div>
          <label class="install-opt">
            <input type="checkbox" id="install-statusline" checked />
            <span>接管状态栏以显示限额 %（5H / 7D，终端显示不变）</span>
          </label>
          <div id="install-msg" class="install-msg hidden"></div>
          <div class="install-actions">
            <button id="install-later" class="install-btn ghost">以后再说</button>
            <button id="install-go" class="install-btn primary">安装 / 更新</button>
          </div>
        </div>
      </div>

      <!-- 卡片右键菜单 -->
      <div id="ctx" class="ctx hidden">
        <button class="ctx-item" data-a="focus">切到该终端</button>
        <button class="ctx-item" data-a="opendir">打开项目目录</button>
        <button class="ctx-item" data-a="copyid">复制会话 ID</button>
        <div class="ctx-div"></div>
        <button class="ctx-item danger" data-a="remove">移除卡片</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
